<header class="flex items-center justify-between px-6 py-4">
  <h1 class="m-0 text-2xl font-bold">Yahtzus</h1>

  <nav>
    <p-button
      icon="pi pi-ellipsis-h"
      severity="secondary"
      variant="text"
      ariaLabel="Menu"
      (onClick)="openMenu($event)"
    />

    <p-menu #menu [model]="menuItems" [popup]="true" />
  </nav>
</header>

<main class="flex-1 grid place-items-center">
  <div class="flex flex-col gap-6">
    <section class="flex flex-col items-center">
      <table class="scorecard">
        <tbody>
          @for (row of rows(); track $index) {
            <tr>
              @for (field of row; track $index) {
                <td
                  [class.preview]="field.isPreview"
                  [class.selectable]="field.canSelect"
                >
                  {{ field.text }}
                </td>
              }
            </tr>
          }
        </tbody>
      </table>
    </section>

    <section class="flex justify-center gap-x-2">
      @for (dice of dices(); track $index) {
        <app-dice
          [value]="dice.num"
          (click)="selectDice($index)"
          [class.preview]="!dice.selected"
        />
      }
    </section>
  </div>
</main>

<footer class="min-h-20 px-6 py-4 flex items-center justify-center">
  <div class="flex items-center justify-center gap-3">
    <p-button
      label="Invite friend"
      severity="secondary"
      (onClick)="inviteFriend()"
    />

    <p-button label="Start game" (onClick)="startGame()" />
  </div>
</footer>

<p-dialog
  header="Info"
  [visible]="showInfo()"
  (visibleChange)="showInfo.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
>
  <p>Here is some info</p>
</p-dialog>

<p-toast />
