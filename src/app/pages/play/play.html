<app-header></app-header>

@if (game()) {
  <main class="flex-1 flex flex-col justify-center items-center gap-y-5 py-5">
    <table class="auto-table">
      <tbody>
        @for (row of rows(); track $index) {
          <tr>
            @for (field of row; track $index) {
              <td
                [class.preview]="field.isPreview"
                [class.selectable]="field.canSelect"
                (click)="field.onSelect()"
              >
                {{ field.text }}
              </td>
            }
          </tr>
        }
      </tbody>
    </table>

    <div class="flex justify-center gap-x-2">
      @for (dice of dices(); track $index) {
        <app-dice
          [value]="dice.num"
          (click)="selectDices($index)"
          [class.selected]="!dice.selected"
        />
      }
    </div>

    @if (game()?.state?.kind === "lobby") {
      <div class="flex items-center justify-center gap-3">
        <button (click)="inviteFriend()">
        Invite friend
        </button>

        <button (click)="startGame()" >
          Start game
        </button>
      </div>
    }

    @if (game()?.state?.kind === "playing") {
    <div class="flex items-center justify-center gap-3">
        <button (click)="rollDices()" [disabled]="!isActivePlayer() || game()?.rollCount! >= 3">
          Roll Dice <span [style.color]="'var(--ui-text-muted)'">{{game()?.rollCount}}/3</span>
        </button>
      </div>
    }
  </main>
}
