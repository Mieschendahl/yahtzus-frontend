<app-header></app-header>

@if (game()) {
  <main class="flex-1 flex flex-col justify-center items-center gap-y-5 py-5">
    <table class="auto-table">
      <tbody>
        @for (row of rows(); track $index) {
          <tr>
            @for (field of row; track $index) {
              <td
                [class.preview]="field.isPreview"
                [class.selectable]="field.canSelect"
              >
                {{ field.text }}
              </td>
            }
          </tr>
        }
      </tbody>
    </table>

    <div class="flex justify-center gap-x-2">
      @for (dice of dices(); track $index) {
        <app-dice
          [value]="dice.num"
          (click)="selectDice($index)"
          [class.preview]="!dice.selected"
        />
      }
    </div>

    @if (game()?.state?.kind === "lobby") {
      <div class="flex items-center justify-center gap-3">
        <button (click)="inviteFriend()">
        Invite friend
        </button>

        <button (click)="startGame()" >
          Start game
        </button>
      </div>
    }

    @if (game()?.state?.kind === "playing") {
    <div class="flex items-center justify-center gap-3">
        <button (click)="rollDices()"> <!-- [disabled]="game()?.rollCount! >= 3"> -->
          Roll Dice <span class="text-gray-400">({{game()?.rollCount}}/3)</span>
        </button>
      </div>
    }
  </main>
}
