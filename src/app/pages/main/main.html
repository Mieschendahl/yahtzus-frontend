<header class="flex items-center px-6 py-4">
  <h1 class="m-0 text-2xl font-bold">
    Yahtzus
  </h1>
</header>

<main class="flex flex-1 items-center justify-center px-6">
  <section class="flex w-80 flex-col items-center gap-4">
    <div class="text-center">
      <h1 class="m-0 text-3xl font-bold">
        Welcome to Yahtzus
      </h1>

      <p class="mt-2 text-color-secondary">
        Choose a username to play
      </p>
    </div>

    <input
      pInputText
      class="w-full input-text"
      type="text"
      placeholder="Username"
      [value]="username()"
      (input)="setUsername($event)"
      (keydown.enter)="play()"
    />

    <p-button
      label="Play"
      severity="primary"
      (onClick)="play()"
    />
  </section>
</main>
