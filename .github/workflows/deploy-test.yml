  name: Deploy test frontend

  on:
    push:
      branches:
        - test

  jobs:
    deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Deploy frontend to test server
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: 91.99.109.255
            username: deploy
            key: ${{ secrets.SERVER_SSH_KEY }}
            script: |
              cd /opt/yahtzus/test/frontend
              git pull origin test
              docker compose up -d --build yahtzus-test-frontend
              docker compose ps